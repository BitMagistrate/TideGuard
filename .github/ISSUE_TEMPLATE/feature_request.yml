name: Feature request
description: Suggest an idea for TideGuard.
title: "[feat] "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Why is the current behaviour insufficient?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: size
    attributes:
      label: Estimated size
      options:
        - "S — < 1 day"
        - "M — 1-3 days"
        - "L — 1 week"
        - "XL — 1-2 weeks"
        - "good-first-issue"
    validations:
      required: true
