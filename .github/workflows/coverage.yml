name: Coverage

on:
  push:
    branches: [main]
  pull_request:

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh
      - name: API coverage
        working-directory: apps/api
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          uv venv && uv pip install -e ".[dev]" coverage
          uv run coverage run -m pytest -q
          uv run coverage xml -o coverage-api.xml
      - name: ML coverage
        working-directory: apps/ml
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          uv venv && uv pip install -e ".[dev]" coverage
          uv run coverage run -m pytest -q
          uv run coverage xml -o coverage-ml.xml
      - name: Upload to Codecov (if token available)
        if: ${{ secrets.CODECOV_TOKEN != '' }}
        uses: codecov/codecov-action@v4
        with:
          files: apps/api/coverage-api.xml,apps/ml/coverage-ml.xml
          token: ${{ secrets.CODECOV_TOKEN }}
