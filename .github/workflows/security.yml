name: Security scans

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 4 * * 1"   # weekly Monday 04:00 UTC

permissions:
  contents: read
  security-events: write

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh
      - name: pip-audit (API)
        working-directory: apps/api
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          uv venv && uv pip install -e ".[dev]"
          uv run pip-audit --strict --ignore-vuln PYSEC-2022-43012 || true
      - name: pip-audit (ML)
        working-directory: apps/ml
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          uv venv && uv pip install -e ".[dev]"
          uv run pip-audit --strict || true
      - name: bandit
        run: |
          pip install bandit
          bandit -q -r apps/api/src apps/ml/src -lll -iii || true

  npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: pnpm/action-setup@v3
        with:
          version: "9"
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level=moderate || true

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          config-path: .gitleaks.toml

  trufflehog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run trufflehog
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.before }}
          head: HEAD
          extra_args: --only-verified
