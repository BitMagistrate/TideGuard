name: CI - ML

on:
  push:
    branches: [main]
    paths:
      - 'apps/ml/**'
      - '.github/workflows/ci-ml.yml'
  pull_request:
    paths:
      - 'apps/ml/**'
      - '.github/workflows/ci-ml.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh
      - name: Install deps
        working-directory: apps/ml
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          uv venv
          uv pip install -e ".[dev]"
      - name: Ruff
        working-directory: apps/ml
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          uv run ruff check src tests
      - name: Pytest (PINN smoke + synthetic training)
        working-directory: apps/ml
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          uv run pytest -q
