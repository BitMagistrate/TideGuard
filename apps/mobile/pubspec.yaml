name: tideguard
description: TideGuard AI — citizen science companion for marine debris.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^17.2.3
  http: ^1.2.1
  image_picker: ^1.1.2
  geolocator: ^12.0.0
  flutter_markdown: ^0.7.3
  flutter_map: ^7.0.0
  latlong2: ^0.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/models/pinn.onnx
    - assets/models/pinn.onnx.data
