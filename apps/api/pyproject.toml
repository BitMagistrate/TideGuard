[project]
name = "tideguard-api"
version = "0.5.0"
description = "TideGuard backend API (FastAPI + PostGIS) — v0.5 monetization stack"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "asyncpg>=0.29",
    "aiosqlite>=0.19",
    "geoalchemy2>=0.14",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "python-jose[cryptography]>=3.3",
    "slowapi>=0.1.9",
    "reportlab>=4.0",
    "boto3>=1.34",
    "numpy>=1.24",
    "pillow>=10.0",
    "email-validator>=2.0",
    "sentry-sdk[fastapi]>=2.0",
    "structlog>=24.1",
    "prometheus-client>=0.25.0",
    "shapely>=2.1.2",
    "imagehash>=4.3.2",
    "piexif>=1.1.3",
    # v0.5 monetization stack
    "stripe>=8.0",
    "qrcode>=7.0",
    "apscheduler>=3.10",
    "resend>=0.7",
    "twilio>=8.0",
    "jinja2>=3.1",
    "openpyxl>=3.1",
    "ortools>=9.7",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.5",
    "mypy>=1.10",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tideguard_api"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E402", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "hypothesis>=6.152.9",
]
